name: Security regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/ogas-firestore-order-hardening]

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:security
